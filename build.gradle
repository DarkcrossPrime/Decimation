plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        decimation {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            client()

            name "Gradle"
            runDir "run"

            programArg "--username"
            programArg "Gradle"

            programArg "--uuid"
            programArg "00000000-0000-0000-0000-000000000000"

            programArg "--quickPlaySingleplayer"
            programArg "Gradle"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

sourceSets {
    main {
        resources {
            srcDir "$buildDir/generated/resources"
            exclude "**/.rsync-tmp/**"
        }
    }
}

tasks.register("prepareContentResources", Exec) {
    group = "decimation"
    description = "Compiles the canonical object-centric content tree into runtime resources."
    inputs.dir layout.projectDirectory.dir("content")
    inputs.files fileTree("tools") { include "**/*.py" }
    outputs.dir layout.buildDirectory.dir("generated/resources")
    doNotTrackState("Generated resources may live on a synchronized workspace filesystem")
    commandLine "python3", "tools/build_runtime_resources.py",
        "--content", "content", "--output", "$buildDir/generated/resources"
}

tasks.register("auditContent", Exec) {
    group = "verification"
    description = "Checks definitions, OBJ references, DANIM files, and asset ownership."
    commandLine "python3", "tools/audit_assets.py", "content"
}

processResources {
    dependsOn tasks.named("prepareContentResources")
    doNotTrackState("Generated resources may live on a synchronized workspace filesystem")
    doFirst {
        delete destinationDir
    }
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

check.dependsOn tasks.named("auditContent")

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("prepareContentResources")
}

jar {
    from("NOTICE.md")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

