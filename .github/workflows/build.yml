name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install positional audio build dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: ./gradlew build
